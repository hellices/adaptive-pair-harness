name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Read-only by default: CI never needs write access to the repository.
permissions:
  contents: read

# Cancel superseded runs for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codespaces-setup:
    name: Codespaces container preparation (no UI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: node:24-bookworm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare and verify as the workspace user
        shell: bash
        run: |
          set -euo pipefail
          install -d -o node -g node /workspaces
          runuser -u node -- bash -se <<'PREPARE'
          set -euo pipefail
          test "$(id -un)" = node
          test "$(id -u)" -ne 0
          unset CODESPACES
          repository=/workspaces/adaptive-pair-harness
          trial="${repository}-growth-trial"
          mkdir "$repository"
          tar --exclude=.git -cf /workspaces/repository.tar -C "$GITHUB_WORKSPACE" .
          tar -xf /workspaces/repository.tar -C "$repository"
          rm /workspaces/repository.tar
          test ! -e "$repository/.git"
          cd "$repository"
          cp -R examples/growth-trial /workspaces/fixture-before
          mkdir /workspaces/expected-trial
          for entry in package.json src test; do
            cp -R "/workspaces/fixture-before/$entry" /workspaces/expected-trial/
          done

          bash .devcontainer/setup.sh
          node scripts/verify-vsix.mjs
          diff -r /workspaces/fixture-before examples/growth-trial
          diff -r /workspaces/expected-trial "$trial"

          trial_status=0
          (cd "$trial" && npm test -- --test-reporter=tap) > /workspaces/growth-trial.tap 2>&1 || trial_status=$?
          cat /workspaces/growth-trial.tap
          test "$trial_status" -eq 1
          grep -Fxq '# tests 6' /workspaces/growth-trial.tap
          grep -Fxq '# pass 2' /workspaces/growth-trial.tap
          grep -Fxq '# fail 4' /workspaces/growth-trial.tap
          grep -Fxq '# cancelled 0' /workspaces/growth-trial.tap
          grep -Fxq '# skipped 0' /workspaces/growth-trial.tap
          grep -Fxq '# todo 0' /workspaces/growth-trial.tap

          printf '\n' >> "$trial/src/retry.mjs"
          printf '%s\n' 'Keep this owner edit.' > "$trial/owner-edit.txt"
          cp -R "$trial" /workspaces/trial-before-rerun
          bash .devcontainer/setup.sh
          node scripts/verify-vsix.mjs
          diff -r /workspaces/trial-before-rerun "$trial"
          diff -r /workspaces/fixture-before examples/growth-trial
          diff -r /workspaces/fixture-before "$GITHUB_WORKSPACE/examples/growth-trial"
          PREPARE

  build-and-package:
    name: Check, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --package-lock-only --audit-level=low

      - name: Install Session Target POC dependencies
        run: npm --prefix poc/session-target ci

      - name: Audit Session Target POC dependencies
        run: npm --prefix poc/session-target audit --package-lock-only --audit-level=low

      - name: Check Session Target POC
        run: npm --prefix poc/session-target run check

      - name: Package Session Target POC
        run: npm --prefix poc/session-target run package

      - name: Install Copilot runtime probe dependencies
        run: npm --prefix poc/copilot-runtime-reuse ci

      - name: Audit Copilot runtime probe dependencies
        run: npm --prefix poc/copilot-runtime-reuse audit --audit-level=low

      - name: Check Copilot runtime probe
        run: npm --prefix poc/copilot-runtime-reuse run check

      - name: Build workspace package exports
        run: npm run typecheck

      - name: Manifest-to-catalog parity tests
        run: npx vitest run apps/vscode-extension/test/manifest.test.ts apps/vscode-extension/test/pairTools.test.ts

      - name: Harness conformance tests
        run: npx vitest run packages/harness packages/protocol/test/toolchain.test.ts

      - name: Typecheck, lint, and full test suite
        run: npm run check

      - name: Build the deterministic bundle
        run: npm run build

      - name: Package the Stable VSIX
        run: npm run package

      - name: Verify the release VSIX
        run: node scripts/verify-vsix.mjs

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: adaptive-pair-stable-vsix
          path: adaptive-pair-0.2.0-preview.2-stable.vsix
          if-no-files-found: error

  host-smoke:
    name: Host smoke (VS Code ${{ matrix.vscode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vscode: ["1.136.2", "1.138.0", "1.140.0"]
    env:
      # Clean-profile coexistence (scenario 2) and idle zero-activity
      # (scenario 3) are asserted inside this isolated Extension Host smoke.
      ADAPTIVE_PAIR_HOST_VERSION: ${{ matrix.vscode }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace package exports
        run: npm run typecheck

      - name: Run isolated Extension Host smoke
        run: xvfb-run -a npm run test:host

      - name: Upload native host failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-host-failure-${{ matrix.vscode }}
          path: |
            ~/.ap-host/run-*/native-history/*.log
            ~/.ap-host/run-*/native-history/*.json
            ~/.ap-host/run-*/native-history/*-logs/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  host-insiders:
    name: Host smoke (Insiders, allowed failure)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      ADAPTIVE_PAIR_HOST_VERSION: insiders
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace package exports
        run: npm run typecheck

      - name: Run isolated Extension Host smoke on Insiders
        run: xvfb-run -a npm run test:host

      - name: Upload native host failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-host-failure-insiders
          path: |
            ~/.ap-host/run-*/native-history/*.log
            ~/.ap-host/run-*/native-history/*.json
            ~/.ap-host/run-*/native-history/*-logs/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
